<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rincón Property | AllTheRooms</title>
  <meta name="description" content="Explore this Rincón short-term rental on AllTheRooms.">
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8">
  <link rel="shortcut icon" href="/favicon.svg?v=8">
  <link rel="stylesheet" href="/assets/css/property-template-v2.css">
  <link rel="stylesheet" href="/assets/css/property-direct-booking.css">
  <link rel="stylesheet" href="/assets/css/property-detail-upgrades.css">
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="property-page property-page-v2">
    <header class="site-header canonical-header">
      <a class="logo brand-lockup" href="/" aria-label="AllTheRooms home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>alltherooms</span>
      </a>
      <nav class="canonical-main-nav" aria-label="Main navigation"><a href="/prototype/host/market/rincon/">Find a stay</a><a href="/travel/puerto-rico/rincon/">Destinations</a><a href="/for-hosts/">For hosts</a></nav>
      <div class="canonical-header-actions"><a class="host-sign-in" href="/prototype/host/">Host sign in</a><a class="nav-cta" href="/claim-my-property/">Claim my property</a></div>
    </header>

    <main id="property-app">
      <section class="property-hero-v2"><div class="atr-container"><div class="property-utility-row"><a class="back-link" href="/prototype/host/market/rincon/">← Explore all Rincón stays</a><span>Loading stay profile</span></div><div class="property-hero-layout"><div class="property-title-row"><p class="section-kicker"><i></i>AllTheRooms property profile</p><h1>Loading property…</h1></div></div></div></section>
    </main>

    <footer class="page-footer">
      <a class="logo brand-lockup" href="/" aria-label="AllTheRooms home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>alltherooms</span></a>
      <p>Better information for better stays.</p>
      <nav aria-label="Footer navigation"><a href="/">Home</a><a href="/travel/puerto-rico/rincon/">Rincón guide</a><a href="/for-hosts/">For hosts</a></nav>
      <small>© 2026 AllTheRooms</small>
    </footer>
  </div>

  <script>
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[character]);
    const httpUrl = (value, fallback = "#") => {
      try {
        const url = new URL(String(value), location.origin);
        return ["http:", "https:"].includes(url.protocol) ? url.href : fallback;
      } catch { return fallback; }
    };
    const safeUrl = (value, fallback = "#") => escapeHtml(httpUrl(value, fallback));
    const money = (value, currency = "USD") => new Intl.NumberFormat("en-US", { style: "currency", currency, maximumFractionDigits: 0 }).format(Number(value || 0));
    const dateLabel = (value) => {
      const date = new Date(`${value}T00:00:00Z`);
      return Number.isNaN(date.getTime()) ? "" : new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", timeZone: "UTC" }).format(date);
    };
    const parts = location.pathname.split("/").filter(Boolean);
    const propertyId = parts[parts.length - 1] === "index.html" ? parts[parts.length - 2] : parts[parts.length - 1];

    const propertyBucket = String(Number(String(propertyId).replace(/\D/g, "").slice(-2) || 0)).padStart(2, "0");
    Promise.all([
      fetch(`/data/public/rincon-details/${propertyBucket}.json`)
        .then((response) => { if (!response.ok) throw new Error("Listings unavailable"); return response.json(); }),
      fetch("/data/public/rincon-direct-websites.json")
        .then((response) => response.ok ? response.json() : {})
        .catch(() => ({})),
    ])
      .then(([rows, directWebsites]) => {
        const listing = rows.find((row) => String(row.id) === decodeURIComponent(propertyId));
        if (!listing) throw new Error("Property unavailable");

        const title = String(listing.title || "Rincón stay").replace(/\s*-\s*/g, "—");
        const description = String(listing.description || "Explore this Rincón stay on AllTheRooms.").replace(/^[A-Z][a-z]{2}\s+\d{1,2},\s+\d{4}\s+·\s+[^·]+\s+·\s+/, "");
        const locationLabel = listing.location || "Rincón, Puerto Rico";
        const images = [...(listing.images || [])];
        if (!images.length && listing.image) images.push({ url: listing.image, caption: title });
        while (images.length < 5) images.push(images[images.length - 1] || { url: "/property/living-room-1.jpg", caption: title });
        const gallery = images.slice(0, 5);
        const rating = Number(listing.rating || 0);
        const reviews = Number(listing.reviews || 0);
        const capacity = Number(listing.capacity || 0);
        const total = Number(listing.quotedPrice || 0);
        const latitude = Number(listing.latitude);
        const longitude = Number(listing.longitude);
        const hasCoordinates = Number.isFinite(latitude) && Number.isFinite(longitude) && Math.abs(latitude) <= 90 && Math.abs(longitude) <= 180;
        const approximateLatitude = hasCoordinates ? Number(latitude.toFixed(3)) : 0;
        const approximateLongitude = hasCoordinates ? Number(longitude.toFixed(3)) : 0;
        const mapBounds = hasCoordinates ? [approximateLongitude - 0.009, approximateLatitude - 0.006, approximateLongitude + 0.009, approximateLatitude + 0.006].map((value) => value.toFixed(6)).join(",") : "";
        const mapEmbedUrl = hasCoordinates ? `https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(mapBounds)}&layer=mapnik` : "";
        const mapPageUrl = hasCoordinates ? `https://www.openstreetmap.org/?mlat=${approximateLatitude}&mlon=${approximateLongitude}#map=15/${approximateLatitude}/${approximateLongitude}` : "";
        const start = new Date(`${listing.checkIn}T00:00:00Z`);
        const end = new Date(`${listing.checkOut}T00:00:00Z`);
        const nights = Math.max(1, Math.round((end - start) / 86400000) || 1);
        const nightly = total / nights;
        const directWebsite = directWebsites[String(listing.id)] || "";
        const directWebsiteAction = directWebsite ? `
          <a class="primary-button booking-action direct-booking-action" href="${safeUrl(directWebsite)}" target="_blank" rel="nofollow noopener">Visit direct website <span>↗</span></a>
          <small class="direct-booking-note">You’ll continue to the property’s own website for direct information and contact options.</small>` : "";
        const sourceDates = dateLabel(listing.checkIn) && dateLabel(listing.checkOut) ? `${dateLabel(listing.checkIn)}–${dateLabel(listing.checkOut)}` : "Current source dates";
        const signal = rating >= 4.9 ? "Exceptional guest signal" : rating >= 4.7 ? "Highly rated stay" : "Active Rincón listing";
        const amenities = listing.amenities || [];
        const amenityDefinitions = [
          { code: "CO", label: "Comfort & bath", pattern: /air conditioning|heating|fan|hot water|hair dryer|shampoo|conditioner|soap|shower|washer|dryer|essentials|hanger|bed linen|pillow|shade|clothing|iron/i },
          { code: "KI", label: "Kitchen & dining", pattern: /kitchen|refrigerator|microwave|cooking|dishes|silverware|freezer|dishwasher|stove|oven|coffee|wine glass|toaster|blender|dining/i },
          { code: "OU", label: "Outdoor & beach", pattern: /beach|ocean|sea view|waterfront|outdoor|patio|balcony|yard|hammock|barbecue|bbq|pool|hot tub|kayak|sun lounger|parking|solar/i },
          { code: "EN", label: "Entertainment & work", pattern: /wifi|tv|workspace|game|sound system/i },
          { code: "FA", label: "Family & stays", pattern: /crib|pack .n play|high chair|booster|pets allowed|long term|luggage|cleaning available/i },
          { code: "SA", label: "Safety & access", pattern: /camera|smoke alarm|carbon monoxide|fire extinguisher|first aid|private entrance|self check-in|keypad|lockbox|doorman/i },
        ];
        const categorized = new Set();
        const amenityGroups = amenityDefinitions.map((group) => ({
          ...group,
          items: amenities.filter((item) => {
            if (!group.pattern.test(item) || categorized.has(item)) return false;
            categorized.add(item);
            return true;
          }),
        })).filter((group) => group.items.length);
        const otherAmenities = amenities.filter((item) => !categorized.has(item));
        if (otherAmenities.length) amenityGroups.push({ code: "MO", label: "More features", items: otherAmenities });

        const extractDetail = (pattern, maximum) => {
          const flags = pattern.flags.includes("g") ? pattern.flags : `${pattern.flags}g`;
          for (const match of description.matchAll(new RegExp(pattern.source, flags))) {
            const value = Number(match[1]);
            if (value > 0 && value <= maximum) return value;
          }
          return 0;
        };
        const extractPhotoDetail = (pattern, maximum) => Math.max(0, ...images.map((image) => {
          const match = String(image.caption || "").match(pattern);
          const value = match ? Number(match[1]) : 0;
          return value <= maximum ? value : 0;
        }));
        const bedrooms = extractDetail(/\b(\d+)\s*(?:-| )\s*bedrooms?\b/i, 30) || extractPhotoDetail(/\bbedroom\s+(\d+)\b/i, 30);
        const bathrooms = extractDetail(/\b(\d+(?:\.\d+)?)\s*(?:-| )\s*(?:full\s+)?bathrooms?\b/i, 30) || extractPhotoDetail(/\b(?:full\s+)?bathroom\s+(\d+)\b/i, 30);
        const beds = extractDetail(/\ba\s+total\s+of\s+(\d+)\s+beds?\b/i, 100) || extractDetail(/\b(\d+)\s+beds?\b/i, 100);
        const kitchens = extractDetail(/\b(\d+)\s+(?:equipped\s+)?kitchens?\b/i, 20);
        const stayDetails = [
          bedrooms ? { label: "Bedrooms", value: bedrooms, note: bedrooms === 1 ? "Private sleeping room" : "Sleeping rooms" } : null,
          bathrooms ? { label: "Bathrooms", value: bathrooms, note: bathrooms === 1 ? "Full bathroom" : "Bathrooms listed" } : null,
          beds ? { label: "Beds", value: beds, note: beds === 1 ? "Listed bed" : "Beds across the stay" } : null,
          kitchens ? { label: "Kitchens", value: kitchens, note: kitchens === 1 ? "Equipped kitchen" : "Kitchen spaces" } : null,
        ].filter(Boolean);

        document.title = `${title} | AllTheRooms`;
        document.querySelector('meta[name="description"]').content = description.slice(0, 155);
        document.querySelector("#property-app").innerHTML = `
          <section class="property-hero-v2">
            <div class="atr-container">
              <div class="property-utility-row"><a class="back-link" href="/prototype/host/market/rincon/">← Explore all Rincón stays</a><span>Stay profile · ATR-${escapeHtml(listing.id)}</span></div>
              <div class="property-hero-layout">
                <div class="property-title-row">
                  <p class="section-kicker"><i></i>Host verified · ${escapeHtml(locationLabel)}</p>
                  <h1>${escapeHtml(title)}</h1>
                  <div class="property-facts" aria-label="Property highlights"><span>${escapeHtml(listing.propertyType || listing.roomType || "Entire stay")}</span><i></i><span>Up to ${escapeHtml(capacity)} guests</span><i></i><span><b>★ ${escapeHtml(rating || "New")}</b> from ${escapeHtml(reviews)} reviews</span></div>
                </div>
                <aside class="property-signal-card" aria-label="AllTheRooms stay intelligence">
                  <div class="property-signal-head"><span>AllTheRooms stay intelligence</span><b>Live</b></div>
                  <div class="property-signal-score"><strong>${escapeHtml(signal)}</strong><span>Top signal</span></div>
                  <dl><div><dt>Location</dt><dd>${escapeHtml(locationLabel)}</dd></div><div><dt>Guest sentiment</dt><dd>${escapeHtml(rating || "New")} / 5</dd></div><div><dt>Listing status</dt><dd>Active</dd></div></dl>
                  <a href="#stay-details">View stay details <span>↓</span></a>
                </aside>
              </div>
            </div>
          </section>

          <section class="property-media-section atr-container">
            <div class="property-gallery" aria-label="Property photo gallery">
              ${gallery.map((image, index) => `<figure class="property-photo photo-${index + 1}"><button class="gallery-photo-button" type="button" data-gallery-index="${index}" aria-label="Open photo ${index + 1} of ${images.length}"><img src="${safeUrl(image.url, "/property/living-room-1.jpg")}" alt="${escapeHtml(image.caption || title)}" loading="${index === 0 ? "eager" : "lazy"}"></button></figure>`).join("")}
              <button class="gallery-button" id="open-property-gallery" type="button">View all ${escapeHtml(images.length)} photos <span>↗</span></button>
            </div>
          </section>

          <section class="property-signal-strip atr-container" aria-label="Stay at a glance">
            <article><header><span>Guest rating</span><i>01</i></header><strong>${escapeHtml(rating || "New")}</strong><small>${escapeHtml(reviews)} verified reviews</small></article>
            <article><header><span>Stay capacity</span><i>02</i></header><strong>${escapeHtml(capacity)}</strong><small>${escapeHtml(listing.propertyType || "Entire stay")}</small></article>
            <article><header><span>Quoted stay</span><i>03</i></header><strong>${money(total, listing.currency || "USD")}</strong><small>${escapeHtml(nights)} nights · ${escapeHtml(sourceDates)}</small></article>
            <article><header><span>Nightly average</span><i>04</i></header><strong>${money(nightly, listing.currency || "USD")}</strong><small>Before final fees</small></article>
          </section>

          ${stayDetails.length ? `<section class="property-spec-strip atr-container" aria-label="Property essentials"><div class="property-spec-heading"><p class="section-kicker">Property essentials</p><span>Details found in the listing source</span></div><div class="property-spec-grid">${stayDetails.map((detail, index) => `<article><header><span>${escapeHtml(detail.label)}</span><i>0${index + 1}</i></header><strong>${escapeHtml(detail.value)}</strong><small>${escapeHtml(detail.note)}</small></article>`).join("")}</div></section>` : ""}

          <section class="property-content atr-container" id="stay-details">
            <div class="property-story">
              <div class="property-intro">
                <p class="section-kicker">The stay</p><h2>A stay worth knowing.<br><span>Details worth seeing.</span></h2>
                <p>${escapeHtml(description)}</p>
                <div class="property-host-note"><span>ATR</span><p><strong>Why it stands out</strong>${escapeHtml(signal)}, room for ${escapeHtml(capacity)} guests and a verified listing source in ${escapeHtml(locationLabel)}.</p></div>
              </div>
              <div class="amenities-section">
                <div class="property-section-heading"><div><p class="section-kicker">What this place offers</p><h2>Everything you need.<br><span>Clearly organized.</span></h2></div><p>Useful listing details grouped around how guests actually use the space.</p></div>
                <div class="amenity-grid amenity-grid-full">${amenityGroups.map((group) => `<article><span>${group.code}</span><h3>${escapeHtml(group.label)}</h3><ul>${group.items.slice(0, 4).map((item) => `<li>✓ ${escapeHtml(item)}</li>`).join("")}</ul>${group.items.length > 4 ? `<small class="amenity-more">+${group.items.length - 4} more</small>` : ""}</article>`).join("")}</div>
                <button class="amenities-button" id="open-amenities" type="button">View all ${escapeHtml(amenities.length)} amenities <span>↗</span></button>
              </div>
              <div class="property-location">
                <div class="location-heading"><div><p class="section-kicker">Where you'll be</p><h2>Close to the coast.<br><span>Rooted in Rincón.</span></h2></div><p>Approximate location supplied by the listing source. Exact directions are confirmed by the booking platform.</p></div>
                ${hasCoordinates ? `<div class="location-map real-location-map" aria-label="Approximate neighborhood map for ${escapeHtml(title)}"><iframe src="${safeUrl(mapEmbedUrl)}" title="Approximate neighborhood map for ${escapeHtml(title)}" loading="lazy" scrolling="no" tabindex="-1" referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="map-tone" aria-hidden="true"></div><div class="approximate-area" aria-hidden="true"><span></span></div><div class="map-pin"><i></i><span>${escapeHtml(title)} area</span></div><a class="map-open-link" href="${safeUrl(mapPageUrl)}" target="_blank" rel="noopener nofollow">Open larger map <b>↗</b></a><a class="map-attribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a></div>` : `<div class="location-map" role="img" aria-label="Approximate property location in Rincón"><div class="map-water">Caribbean Sea</div><i class="map-road road-one"></i><i class="map-road road-two"></i><i class="map-road road-three"></i><span class="map-place place-one">Rincón</span><span class="map-place place-two">Balneario</span><span class="map-place place-three">Plaza</span><div class="map-pin"><i></i>${escapeHtml(title)} area</div></div>`}
              </div>
            </div>
            <aside class="booking-panel" aria-label="Booking summary">
              <div class="booking-panel-top"><div><p>Quoted stay</p><span>Airbnb source · ${escapeHtml(sourceDates)}</span></div><b>${escapeHtml(nights)} nights</b><strong>${money(total, listing.currency || "USD")}</strong><small>${money(nightly, listing.currency || "USD")} per night before final fees</small></div>
              <div class="booking-breakdown"><span><small>Property type</small><b>${escapeHtml(listing.propertyType || listing.roomType || "Entire stay")}</b></span><span><small>Guest capacity</small><b>Up to ${escapeHtml(capacity)}</b></span></div>
              <div class="booking-confidence"><span><i></i> Live source quote</span><p>Price and availability may have changed since the source listing was captured.</p></div>
              <a class="primary-button booking-action" href="${safeUrl(listing.url)}" target="_blank" rel="nofollow sponsored noopener">View and book on Airbnb <span>↗</span></a>
              <small>You’ll continue to Airbnb to confirm current availability, fees and policies.</small>
              ${directWebsiteAction}
              <div class="property-owner-link"><span>Own or manage this property?</span><a href="/prototype/host/">Open the Host toolkit <b>↗</b></a></div>
            </aside>
          </section>

          <section class="property-next"><div class="atr-container"><div><p class="section-kicker light">Know before you book</p><h2>One stay.<br><span>A clearer choice.</span></h2></div><p>AllTheRooms brings the listing, neighborhood and market signals together—so the room you choose fits the trip you actually want.</p><a class="light-link" href="/travel/puerto-rico/rincon/">Explore Rincón <span>↗</span></a></div></section>

          <div class="property-modal gallery-modal" id="property-gallery-modal" role="dialog" aria-modal="true" aria-labelledby="gallery-modal-title" hidden>
            <div class="property-dialog gallery-dialog">
              <header><div><p class="section-kicker">Property photos</p><h2 id="gallery-modal-title">${escapeHtml(title)}</h2></div><button class="modal-close" type="button" data-modal-close aria-label="Close photo gallery">×</button></header>
              <div class="gallery-stage"><button class="gallery-arrow gallery-previous" type="button" aria-label="Previous photo">←</button><img id="gallery-active-image" alt=""><button class="gallery-arrow gallery-next" type="button" aria-label="Next photo">→</button></div>
              <footer><div><strong id="gallery-count"></strong><span id="gallery-caption"></span></div><div class="gallery-thumbnails" id="gallery-thumbnails" aria-label="Choose a property photo"></div></footer>
            </div>
          </div>

          <div class="property-modal amenities-modal" id="amenities-modal" role="dialog" aria-modal="true" aria-labelledby="amenities-modal-title" hidden>
            <div class="property-dialog amenities-dialog">
              <header><div><p class="section-kicker">What this place offers</p><h2 id="amenities-modal-title">All ${escapeHtml(amenities.length)} amenities</h2></div><button class="modal-close" type="button" data-modal-close aria-label="Close amenities">×</button></header>
              <div class="amenities-dialog-grid">${amenityGroups.map((group) => `<section><span>${group.code}</span><h3>${escapeHtml(group.label)}</h3><ul>${group.items.map((item) => `<li><i>✓</i>${escapeHtml(item)}</li>`).join("")}</ul></section>`).join("")}</div>
            </div>
          </div>`;

        const galleryModal = document.querySelector("#property-gallery-modal");
        const amenitiesModal = document.querySelector("#amenities-modal");
        const galleryImage = document.querySelector("#gallery-active-image");
        const galleryCaption = document.querySelector("#gallery-caption");
        const galleryCount = document.querySelector("#gallery-count");
        const galleryThumbnails = document.querySelector("#gallery-thumbnails");
        let currentGalleryIndex = 0;
        let modalReturnFocus = null;

        const renderGalleryImage = (requestedIndex) => {
          currentGalleryIndex = (requestedIndex + images.length) % images.length;
          const image = images[currentGalleryIndex];
          galleryImage.src = httpUrl(image.url, "/property/living-room-1.jpg");
          galleryImage.alt = image.caption || title;
          galleryCaption.textContent = image.caption || title;
          galleryCount.textContent = `${currentGalleryIndex + 1} / ${images.length}`;
          galleryThumbnails.querySelectorAll("button").forEach((button, index) => button.setAttribute("aria-current", String(index === currentGalleryIndex)));
        };
        const buildGalleryThumbnails = () => {
          if (galleryThumbnails.children.length) return;
          galleryThumbnails.innerHTML = images.map((image, index) => `<button type="button" data-thumbnail-index="${index}" aria-label="View photo ${index + 1}"><img src="${safeUrl(image.url, "/property/living-room-1.jpg")}" alt="" loading="lazy"></button>`).join("");
          galleryThumbnails.querySelectorAll("button").forEach((button) => button.addEventListener("click", () => renderGalleryImage(Number(button.dataset.thumbnailIndex))));
        };
        const openModal = (modal, trigger) => {
          modalReturnFocus = trigger;
          modal.hidden = false;
          document.body.classList.add("property-modal-open");
          modal.querySelector(".modal-close").focus();
        };
        const closeModal = (modal) => {
          modal.hidden = true;
          document.body.classList.remove("property-modal-open");
          modalReturnFocus?.focus();
        };
        const openGallery = (trigger, index = 0) => {
          buildGalleryThumbnails();
          renderGalleryImage(index);
          openModal(galleryModal, trigger);
        };

        document.querySelector("#open-property-gallery").addEventListener("click", (event) => openGallery(event.currentTarget));
        document.querySelectorAll(".gallery-photo-button").forEach((button) => button.addEventListener("click", () => openGallery(button, Number(button.dataset.galleryIndex))));
        document.querySelector(".gallery-previous").addEventListener("click", () => renderGalleryImage(currentGalleryIndex - 1));
        document.querySelector(".gallery-next").addEventListener("click", () => renderGalleryImage(currentGalleryIndex + 1));
        document.querySelector("#open-amenities").addEventListener("click", (event) => openModal(amenitiesModal, event.currentTarget));
        document.querySelectorAll("[data-modal-close]").forEach((button) => button.addEventListener("click", () => closeModal(button.closest(".property-modal"))));
        document.querySelectorAll(".property-modal").forEach((modal) => modal.addEventListener("click", (event) => { if (event.target === modal) closeModal(modal); }));
        document.addEventListener("keydown", (event) => {
          const openOverlay = document.querySelector(".property-modal:not([hidden])");
          if (!openOverlay) return;
          if (event.key === "Escape") closeModal(openOverlay);
          if (openOverlay === galleryModal && event.key === "ArrowLeft") renderGalleryImage(currentGalleryIndex - 1);
          if (openOverlay === galleryModal && event.key === "ArrowRight") renderGalleryImage(currentGalleryIndex + 1);
        });
      })
      .catch(() => {
        document.querySelector("#property-app").innerHTML = `<section class="property-hero-v2"><div class="atr-container"><div class="property-utility-row"><a class="back-link" href="/prototype/host/market/rincon/">← Explore all Rincón stays</a></div><div class="property-title-row"><p class="section-kicker"><i></i>AllTheRooms property profile</p><h1>Property unavailable.</h1><p class="property-hero-summary">Return to the Rincón market explorer and choose another listing.</p></div></div></section>`;
      });
  </script>
</body>
</html>
